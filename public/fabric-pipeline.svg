<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none" role="img" aria-label="Microsoft Fabric medallion data pipeline: NYC Taxi, OpenAQ and World Bank / ECB sources flowing through Bronze, Silver and Gold layers into four Power BI dashboards">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#242424"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cd7f44"/><stop offset="1" stop-color="#a05a28"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe3e8"/><stop offset="1" stop-color="#aab2bd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd64a"/><stop offset="1" stop-color="#eda503"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="56" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Microsoft Fabric</text>
  <text x="40" y="84" font-family="Arial, sans-serif" font-size="16" font-weight="500" fill="#9aa0a6">Bronze &#8594; Silver &#8594; Gold medallion pipeline</text>
  <rect x="40" y="98" width="56" height="4" rx="2" fill="#eda503"/>

  <!-- sources -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="40"  y="150" width="150" height="40" rx="20" fill="#2a2a2a" stroke="#3a3a3a"/>
    <text x="115" y="175" fill="#e2e2e2" text-anchor="middle">NYC Taxi</text>
    <rect x="40"  y="200" width="150" height="40" rx="20" fill="#2a2a2a" stroke="#3a3a3a"/>
    <text x="115" y="225" fill="#e2e2e2" text-anchor="middle">OpenAQ</text>
    <rect x="40"  y="250" width="150" height="40" rx="20" fill="#2a2a2a" stroke="#3a3a3a"/>
    <text x="115" y="275" fill="#e2e2e2" text-anchor="middle">World Bank / ECB</text>
  </g>

  <!-- flow arrow from sources to layers -->
  <path d="M196 220 H236" stroke="#5a5a5a" stroke-width="2"/>
  <path d="M236 220 l-8 -5 v10 z" fill="#5a5a5a"/>

  <!-- medallion layers -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="250" y="150" width="120" height="140" rx="14" fill="url(#bronze)"/>
    <text x="310" y="212" font-size="17" font-weight="700" fill="#3a2410">Bronze</text>
    <text x="310" y="234" font-size="12" fill="#3a2410">raw ingest</text>

    <rect x="386" y="150" width="120" height="140" rx="14" fill="url(#silver)"/>
    <text x="446" y="212" font-size="17" font-weight="700" fill="#2c3036">Silver</text>
    <text x="446" y="234" font-size="12" fill="#2c3036">cleaned</text>

    <rect x="522" y="150" width="120" height="140" rx="14" fill="url(#gold)"/>
    <text x="582" y="212" font-size="17" font-weight="700" fill="#3a2c00">Gold</text>
    <text x="582" y="234" font-size="12" fill="#3a2c00">modelled</text>
  </g>

  <!-- arrow to Power BI -->
  <path d="M648 220 H688" stroke="#5a5a5a" stroke-width="2"/>
  <path d="M688 220 l-8 -5 v10 z" fill="#5a5a5a"/>

  <!-- Power BI dashboards (stacked bars logo motif) -->
  <g transform="translate(694,150)">
    <rect x="0" y="0" width="66" height="140" rx="12" fill="#2a2a2a" stroke="#3a3a3a"/>
    <rect x="14" y="96" width="11" height="30" rx="2" fill="#ffe082"/>
    <rect x="28" y="74" width="11" height="52" rx="2" fill="#ffca28"/>
    <rect x="42" y="50" width="11" height="76" rx="2" fill="#eda503"/>
  </g>
  <text x="727" y="312" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#e2e2e2" text-anchor="middle">Power BI</text>

  <!-- footer caption -->
  <text x="40" y="360" font-family="Arial, sans-serif" font-size="14" fill="#9aa0a6">4 interactive dashboards &#183; staged data layers &#183; end-to-end ETL</text>
</svg>
